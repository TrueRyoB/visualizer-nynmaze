<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NYN 迷路ビジュアライザ</title>
  <style>
    :root { --ink:#203047; --muted:#64748b; --blue:#2d6cdf; --paper:#f6f8fc; --line:#dbe3ef; --red:#d84b52; --green:#169873; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding:22px max(24px,calc((100% - 1440px)/2)); background:linear-gradient(115deg,#1d385f,#2d6cdf); color:#fff; }
    h1 { margin:0; font-size:clamp(21px,3vw,30px); } header p { margin:6px 0 0; opacity:.88; font-size:14px; }
    main { max-width:1440px; margin:0 auto; padding:20px 24px 32px; display:grid; grid-template-columns:minmax(300px,400px) minmax(0,1fr); gap:20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 18px #3050780c; }
    .controls { padding:18px; align-self:start; } h2 { font-size:16px; margin:0 0 9px; } .hint { color:var(--muted); font-size:12px; line-height:1.55; margin:0 0 8px; }
    textarea { width:100%; resize:vertical; min-height:185px; padding:11px; border:1px solid #bfccdc; border-radius:9px; font:13px/1.45 ui-monospace,Consolas,monospace; color:var(--ink); background:#fbfdff; }
    textarea:focus { outline:3px solid #bcd4ff; border-color:var(--blue); } .output { min-height:155px; }
    .buttons { display:flex; gap:8px; margin-top:12px; } button { cursor:pointer; border:0; border-radius:9px; font-weight:700; padding:10px 13px; color:#fff; background:var(--blue); } button:hover { filter:brightness(.94); } button.secondary { color:var(--ink); background:#e8eef7; }
    .view { min-width:0; padding:18px; } .status-row { display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
    .badge { border-radius:999px; background:#edf3fd; color:#315481; font-size:13px; padding:6px 10px; } .badge.ok { background:#ddf7ed; color:#087154; } .badge.error { background:#ffe6e7; color:#a53036; }
    #board-wrap { overflow:auto; border:1px solid var(--line); border-radius:11px; background:#eef3f9; max-height:600px; padding:14px; }
    #board { display:grid; width:max-content; margin:auto; background:#9ab0c9; gap:var(--gap, 1px); }
    .cell { position:relative; width:var(--cell); height:var(--cell); min-width:var(--cell); background:#fff; display:grid; place-items:center; overflow:hidden; }
    .cell.wall { background:#46586d; }.cell.wall::after { content:""; position:absolute; inset:0; background:url('img/wall.png') center/cover no-repeat; opacity:.92; }
    .goal { background:#fff2c2 url('img/goal.png') center/contain no-repeat; }.start { background:#dff2ff; color:#2876aa; font-weight:800; font-size:calc(var(--cell) * .4); }
    .trail { box-shadow:inset 0 0 0 max(1px,calc(var(--cell) * .08)) #91bffe; }.person { position:absolute; z-index:2; width:120%; height:120%; object-fit:contain; transform:rotate(var(--angle)); transition:all .18s ease; filter:drop-shadow(1px 2px 1px #1a274855); }
    .zoom-row { display:flex; align-items:center; justify-content:center; gap:9px; padding:9px 0 1px; color:var(--muted); font-size:12px; }.zoom-row input { width:150px; accent-color:var(--blue); }
    .timeline { margin-top:15px; padding:13px; background:#f7faff; border-radius:10px; }.time-head { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; }.time-head strong { font-family:ui-monospace,monospace; }.playback-actions { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }.speed { display:flex; align-items:center; gap:4px; white-space:nowrap; }.speed select { padding:8px 5px; border:1px solid #c8d6e8; border-radius:7px; background:#fff; color:var(--ink); font-weight:700; }
    #scrubber { width:100%; accent-color:var(--blue); margin:11px 0 7px; } .step-scroll { overflow-x:auto; padding-bottom:5px; }.steps { display:flex; min-width:max-content; gap:5px; }.step { border:1px solid #d4dfed; background:#fff; border-radius:6px; padding:6px 9px; font:12px ui-monospace,monospace; color:#56657a; }.step.active { color:#fff; background:var(--blue); border-color:var(--blue); }.step.bad { background:#fff0f0; color:#b43b43; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; margin-top:13px; font-size:12px; color:var(--muted); }.legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-2px; }.note { margin:12px 0 0; padding:10px 12px; border-left:4px solid #86afea; background:#f1f6ff; font-size:13px; line-height:1.5; }
    @media(max-width:850px) { main { grid-template-columns:1fr; padding:14px; } header { padding:18px 14px; } #board-wrap { max-height:55vh; } }
  </style>
</head>
<body>
  <header><h1>NYN 迷路ビジュアライザ</h1><p>盤面と出力を貼り付けるだけで、指示ごとの動きを確認できます。</p></header>
  <main>
    <section class="card controls">
      <h2>1. 盤面情報</h2>
      <p class="hint">1行目に N、その後に N 行の盤面（S / G / # / .）を入力します。</p>
      <textarea id="maze" spellcheck="false">7
#######
#S....#
###.#.#
#...#G#
#.###.#
#.....#
#######</textarea>
      <h2 style="margin-top:18px">2. 出力（指示列）</h2>
      <p class="hint">close / open / turn / move / end を、1行ずつ入力します。</p>
      <textarea class="output" id="commands" spellcheck="false">turn
move
move
turn
move
move
move
turn
move
move
turn
move
move
end</textarea>
      <div class="buttons"><button id="reflect">反映する</button><button class="secondary" id="reset">最初に戻る</button></div>
    </section>
    <section class="card view">
      <div class="status-row"><span class="badge" id="state">準備完了</span><span class="badge" id="position">位置: -</span><span class="badge" id="face">向き: 北</span></div>
      <div id="board-wrap"><div id="board"></div></div>
      <div class="zoom-row"><span>表示倍率</span><input id="zoom" type="range" min="1" max="1" value="1" step="1" aria-label="盤面の表示倍率"><strong id="zoom-value">自動</strong></div>
      <div class="timeline">
        <div class="time-head"><div class="playback-actions"><button id="play">▶ 再生</button><label class="speed">速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><button class="secondary" id="save-gif">GIF保存</button></div><strong id="counter">0 / 0</strong><span id="command-label">開始状態</span></div>
        <input id="scrubber" type="range" min="0" max="0" value="0" aria-label="手順スクロールバー">
        <div class="step-scroll" id="step-scroll"><div class="steps" id="steps"></div></div>
      </div>
      <div class="legend"><span><i style="background:#fff2c2"></i>ゴール</span><span><i style="background:#dff2ff"></i>スタート</span><span><i style="background:#46586d"></i>壁</span><span><i style="background:#91bffe"></i>通過した場所</span></div>
      <p class="note" id="message">「反映する」を押すと、ここに実行結果が表示されます。</p>
    </section>
  </main>

      let s=null,g=null; map.forEach((row,r)=>[...row].forEach((v,c)=>{if(v==='S')s=[r,c];if(v==='G')g=[r,c]})); if(!s||!g) throw Error('S と G をそれぞれ1つ置いてください。');
      return {n,map,s,g};
    }
    function simulate(d){
      const cmds=commandInput.value.split(/\s+/).filter(Boolean); const current={r:d.s[0],c:d.s[1],dir:0,closed:false,closedMoves:0,trail:[[...d.s]],status:'実行前',error:false}; const list=[structuredClone(current)];
      for(let i=0;i<cmds.length;i++) { const cmd=cmds[i]; let next=structuredClone(list.at(-1)); next.cmd=cmd; next.index=i+1;
        const fail=t=>{next.status=t;next.error=true};
        if(next.error) continue;
        if(i+1>7*d.n) fail(`指示数が上限（${7*d.n}）を超えました`);
        else if(cmd==='close') {next.closed=true;next.status='目を閉じました';}
        else if(cmd==='open') {if(!next.closed) next.status='すでに目は開いています'; else if(d.map[next.r][next.c]==='#') fail('壁の中で目を開けたためゲームオーバー'); else {next.closed=false;next.closedMoves=0;next.status='目を開けました';}}
        else if(cmd==='turn') {next.dir=(next.dir+1)%4;next.status='時計回りに回転';}
        else if(cmd==='move') {const [dr,dc]=dirs[next.dir],nr=next.r+dr,nc=next.c+dc; if(nr<0||nr>=d.n||nc<0||nc>=d.n) fail('迷路の外へ出たためゲームオーバー'); else if(next.closed) {next.r=nr;next.c=nc;next.closedMoves++;next.trail.push([nr,nc]); if(next.closedMoves>4) fail('目を閉じて5歩進んだためゲームオーバー'); else next.status=`前進（閉眼 ${next.closedMoves}/4 歩）`;} else if(d.map[nr][nc]==='#') next.status='壁にぶつかったため移動しません'; else {next.r=nr;next.c=nc;next.trail.push([nr,nc]);next.status='前進';}}
        else if(cmd==='end') {if(next.r===d.g[0]&&next.c===d.g[1]) next.status='ゴール到達！ AC'; else fail('ゴールにいない状態で終了しました');}
        else fail(`不明な命令「${cmd}」です`);
        list.push(next); if(next.error||cmd==='end') { for(let j=i+1;j<cmds.length;j++){const hold=structuredClone(next);hold.cmd=cmds[j];hold.index=j+1;list.push(hold)} break; }
      } return {cmds,list};
    }
    function applyZoom(){if(!data)return;const scale=+zoom.value, size=baseCell*scale;board.style.setProperty('--cell',size+'px');board.style.setProperty('--gap',size>=6?'1px':'0px');board.style.gridTemplateColumns=`repeat(${data.n}, var(--cell))`;el('zoom-value').textContent=scale===1?'自動（全体表示）':`${scale}×`}
    function drawBase(){ baseCell=Math.max(2,Math.min(38,Math.floor(560/data.n)));const maxZoom=data.n<=20?4:data.n<=100?5:4;zoom.max=maxZoom;zoom.value=1;applyZoom();board.innerHTML=''; data.map.forEach((row,r)=>[...row].forEach((x,c)=>{const cell=document.createElement('div');cell.className='cell '+(x==='#'?'wall':x==='G'?'goal':x==='S'?'start':'');cell.dataset.pos=`${r},${c}`;if(x==='S')cell.textContent='S';board.append(cell)})); }
    function render(i){if(!data)return; const s=states[i]; document.querySelectorAll('.cell').forEach(x=>x.classList.remove('trail'));s.trail.forEach(([r,c])=>{const q=document.querySelector(`[data-pos="${r},${c}"]`);if(q)q.classList.add('trail')});document.querySelectorAll('.person').forEach(x=>x.remove());const cell=document.querySelector(`[data-pos="${s.r},${s.c}"]`);const img=document.createElement('img');img.className='person';img.src=s.closed?'img/closed.png':'img/open.png';img.style.setProperty('--angle',dirs[s.dir][3]+'deg');img.alt=s.closed?'目を閉じたNYN':'目を開けたNYN';cell.append(img);
      el('counter').textContent=`${i} / ${states.length-1}`;el('command-label').textContent=i?`${s.index}. ${s.cmd}`:'開始状態';el('position').textContent=`位置: (${s.r+1}, ${s.c+1})`;el('face').textContent=`向き: ${dirs[s.dir][2]}・${s.closed?'閉眼':'開眼'}`;el('state').textContent=s.status;el('state').className='badge '+(s.error?'error':s.status.includes('AC')?'ok':'');el('message').textContent=s.error?`停止: ${s.status}`:s.status.includes('AC')?'成功: ゴールに到達して終了しました。':`状態: ${s.status}`;
      scrubber.value=i;document.querySelectorAll('.step').forEach((x,j)=>x.classList.toggle('active',j===i)); const active=document.querySelector('.step.active');if(active)active.scrollIntoView({block:'nearest',inline:'center'});
    }
    function gifHeader(w,h){const a=[71,73,70,56,57,97,w&255,w>>8,h&255,h>>8,247,0,0];for(let i=0;i<256;i++)a.push(((i>>5)*255/7)|0,(((i>>2)&7)*255/7)|0,((i&3)*255/3)|0);a.push(33,255,11,...[78,69,84,83,67,65,80,69,50,46,48],3,1,0,0,0);return new Uint8Array(a)}
    // Clear code before every pixel: less compact but accepted reliably by GIF decoders.
    function gifLzw(pixels){let out=[],bits=0,buffer=0;const emit=code=>{buffer|=code<<bits;bits+=9;while(bits>=8){out.push(buffer&255);buffer>>>=8;bits-=8}};for(let i=0;i<pixels.length;i++){emit(256);emit(pixels[i])}emit(257);if(bits)out.push(buffer&255);return new Uint8Array(out)}
    function gifFrameBlock(pixels,w,h,delay){const compressed=gifLzw(pixels), chunks=[new Uint8Array([33,249,4,0,delay&255,delay>>8,0,0,44,0,0,0,0,w&255,w>>8,h&255,h>>8,0,8])];for(let i=0;i<compressed.length;i+=255){const part=compressed.slice(i,i+255);chunks.push(new Uint8Array([part.length]),part)}chunks.push(new Uint8Array([0]));return chunks}
    function indexedPixels(ctx,w,h){const src=ctx.getImageData(0,0,w,h).data, dst=new Uint8Array(w*h);for(let i=0,p=0;i<src.length;i+=4,p++)dst[p]=(src[i]>>5<<5)|(src[i+1]>>5<<2)|(src[i+2]>>6);return dst}
    function loadGifImage(src){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('埋め込み素材を読み込めません'));image.src=src})}
    function getGifPictures(){if(gifPictures)return Promise.resolve(gifPictures);return Promise.all([embeddedAssets.wall,embeddedAssets.open,embeddedAssets.closed,embeddedAssets.goal].map(loadGifImage)).then(([wall,open,closed,goal])=>(gifPictures={wall,open,closed,goal}))}
    function drawContained(ctx,image,x,y,w,h){const scale=Math.min(w/image.width,h/image.height),iw=image.width*scale,ih=image.height*scale;ctx.drawImage(image,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
    function paintGifFrame(ctx,size,s,pictures){const n=data.n,pad=8,side=size-pad*2,cell=side/n;ctx.fillStyle='#f4f7fc';ctx.fillRect(0,0,size,size);ctx.fillStyle='#ffffff';ctx.fillRect(pad,pad,side,side);for(let r=0;r<n;r++)for(let c=0;c<n;c++){const x=pad+c*cell,y=pad+r*cell,tile=data.map[r][c];if(tile==='#')ctx.drawImage(pictures.wall,x,y,cell,cell);else if(tile==='G')drawContained(ctx,pictures.goal,x,y,cell,cell);else if(tile==='S'){ctx.fillStyle='#def1ff';ctx.fillRect(x,y,cell,cell)}}ctx.strokeStyle='#84b6ff';ctx.lineWidth=Math.max(1,cell*.12);for(const [r,c] of s.trail)ctx.strokeRect(pad+c*cell+ctx.lineWidth/2,pad+r*cell+ctx.lineWidth/2,Math.max(0,cell-ctx.lineWidth),Math.max(0,cell-ctx.lineWidth));ctx.save();ctx.translate(pad+(s.c+.5)*cell,pad+(s.r+.5)*cell);ctx.rotate(dirs[s.dir][3]*Math.PI/180);const sprite=s.closed?pictures.closed:pictures.open,box=cell*1.22,scale=Math.min(box/sprite.width,box/sprite.height);ctx.drawImage(sprite,-sprite.width*scale/2,-sprite.height*scale/2,sprite.width*scale,sprite.height*scale);ctx.restore()}
    const pause=()=>new Promise(resolve=>requestAnimationFrame(resolve));
    async function saveGif(){if(!data||states.length<2)return;clearInterval(timer);timer=null;el('play').textContent='▶ 再生';const button=el('save-gif');button.disabled=true;button.textContent='GIF作成中…';try{const pictures=await getGifPictures(),last=states.length-1,maxFrames=20,stride=Math.max(1,Math.ceil(last/Math.max(1,maxFrames-1))),frameIndexes=[];for(let i=0;i<=last;i+=stride)frameIndexes.push(i);if(frameIndexes.at(-1)!==last)frameIndexes.push(last);const targetBytes=14*1024*1024,bytesPerPixel=2.255,side=Math.min(2048,Math.max(320,Math.floor(Math.sqrt(targetBytes/(bytesPerPixel*frameIndexes.length))))),canvas=document.createElement('canvas');canvas.width=canvas.height=side;const ctx=canvas.getContext('2d',{willReadFrequently:true}),chunks=[gifHeader(side,side)],delay=Math.max(3,Math.min(100,Math.round(55*stride/+speed.value)));for(let i=0;i<frameIndexes.length;i++){paintGifFrame(ctx,side,states[frameIndexes[i]],pictures);chunks.push(...gifFrameBlock(indexedPixels(ctx,side,side),side,side,delay));if(i%2===0){el('message').textContent=`GIFを作成中… ${i+1} / ${frameIndexes.length} フレーム`;await pause()}}chunks.push(new Uint8Array([59]));const file=new Blob(chunks,{type:'image/gif'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=`nyn-maze-${side}px.gif`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);el('message').textContent=`${side}×${side}px・${(file.size/1024/1024).toFixed(1)}MB のGIFを保存しました（素材画像を使用）。${stride>1?' 長い手順のため一部のフレームを間引いています。':''}`}catch(error){el('message').textContent=`GIFの作成に失敗しました: ${error.message||'不明なエラー'}`;console.error(error)}finally{button.disabled=false;button.textContent='GIF保存'}}
    const storageKey='nyn-maze-visualizer-input-v1';
    function saveInputs(){try{localStorage.setItem(storageKey,JSON.stringify({maze:mazeInput.value,commands:commandInput.value}))}catch(e){console.warn('入力を保存できませんでした',e)}}
    function restoreInputs(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&typeof saved.maze==='string'&&typeof saved.commands==='string'){mazeInput.value=saved.maze;commandInput.value=saved.commands}}catch(e){console.warn('保存済み入力を読めませんでした',e)}}
    function build(){saveInputs();clearInterval(timer);timer=null;el('play').textContent='▶ 再生';try {data=parse();const result=simulate(data);states=result.list;drawBase();scrubber.max=states.length-1;scrubber.value=0;stepsEl.innerHTML='';states.forEach((s,i)=>{const b=document.createElement('button');b.className='step'+(s.error?' bad':'');b.textContent=i?`${i}: ${s.cmd}`:'0: start';b.onclick=()=>render(i);stepsEl.append(b)});render(0);}catch(e){board.innerHTML='';states=[];el('state').textContent='入力エラー';el('state').className='badge error';el('message').textContent=e.message;}}
    function togglePlay(){if(timer){clearInterval(timer);timer=null;el('play').textContent='▶ 再生';return}let i=+scrubber.value;if(i>=states.length-1)i=0;render(i);el('play').textContent='❚❚ 一時停止';timer=setInterval(()=>{i++;render(i);if(i>=states.length-1){clearInterval(timer);timer=null;el('play').textContent='▶ 再生'}},Math.round(550/+speed.value))}
    el('reflect').onclick=build;el('reset').onclick=()=>{clearInterval(timer);timer=null;el('play').textContent='▶ 再生';render(0)};el('play').onclick=togglePlay;el('save-gif').onclick=saveGif;zoom.oninput=applyZoom;speed.onchange=()=>{if(timer){clearInterval(timer);timer=null;el('play').textContent='▶ 再生'}};mazeInput.oninput=saveInputs;commandInput.oninput=saveInputs;mazeInput.onblur=build;commandInput.onblur=build;scrubber.oninput=e=>{clearInterval(timer);timer=null;el('play').textContent='▶ 再生';render(+e.target.value)};restoreInputs();build();
  </script>
